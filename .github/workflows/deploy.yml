name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: docker compose -f compose.yml -f deploy/compose.production.yml config --quiet

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: prom-enter-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send source and deploy
        id: ship
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping outdated commit $GITHUB_SHA; main is $latest" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${DEPLOY_HOST:?}" "${DEPLOY_PORT:?}" "${DEPLOY_USER:?}" "${DEPLOY_KNOWN_HOSTS:?}" "${DEPLOY_SSH_KEY:?}"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/prom-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/prom-known-hosts"
          # The application serves WebP. Keep source PNGs in Git and out of the deployment archive.
          git archive --format=tar "$GITHUB_SHA" . ':(exclude,glob)frontend/public/images/**/*.png' > "$RUNNER_TEMP/prom-source.tar"
          digest=$(sha256sum "$RUNNER_TEMP/prom-source.tar")
          ssh -i "$RUNNER_TEMP/prom-deploy-key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/prom-known-hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA ${digest%% *}" \
            < "$RUNNER_TEMP/prom-source.tar"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Check public HTTPS
        if: steps.ship.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 15 https://prom-enter.ajy720.me/ -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 15 https://prom-enter.ajy720.me/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          echo "Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/prom-deploy-key" "$RUNNER_TEMP/prom-known-hosts" "$RUNNER_TEMP/prom-source.tar"
