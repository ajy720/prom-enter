# Only the existing Nginx Proxy Manager and container-local health checks enter.
# NPM sets X-Real-IP and X-Forwarded-Proto; never expose this port directly.
map $http_x_real_ip $prom_client {
    "" $remote_addr;
    default $http_x_real_ip;
}
map $http_x_forwarded_proto $prom_scheme {
    default $scheme;
    https https;
}
limit_req_zone $prom_client zone=prom_api:10m rate=30r/m;
limit_conn_zone $prom_client zone=prom_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    allow 192.168.1.100;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 64k;
    limit_req_status 429;
    limit_conn_status 429;
    location /api/ {
        limit_req zone=prom_api burst=10 nodelay;
        limit_conn prom_connections 3;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $prom_client;
        proxy_set_header X-Forwarded-Proto $prom_scheme;
        proxy_read_timeout 100s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
